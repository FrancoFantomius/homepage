<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Ultra-fast, customizable, privacy-respecting browser homepage with customizable search engines.">
  <title>New Tab</title>
  <script>
    (function () {
      try {
        const saved = localStorage.getItem('hp_config');
        const theme = saved ? JSON.parse(saved).theme : 'auto';
        let resolved = theme;
        if (!theme || theme === 'auto') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.setAttribute('data-theme-mode', theme || 'auto');
      } catch (e) { }
    })();
  </script>
  <link rel="preconnect" href="https://icons.duckduckgo.com" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0a0e17">
  <link rel="icon" type="image/svg+xml" href="img/icon.svg">
</head>

<body>
  <!-- Background Glow / Effects -->
  <div class="bg-effects">
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
  </div>

  <div class="app-container">
    <!-- Header / Top Bar -->
    <header class="top-nav">
      <div class="nav-left">
        <div class="date-badge" id="current-date" data-i18n="general.today">Today</div>
      </div>
      <div class="nav-right">
        <button id="settings-btn" class="icon-btn" title="Settings" data-i18n-title="header.settings" aria-label="Open Settings" data-i18n-aria-label="header.settingsAria">
          <img src="img/settings.svg" class="icon-img" width="20" height="20" alt="Settings">
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Live Clock & Dynamic Greeting -->
      <section class="time-section" id="time-section">
        <div class="digital-clock" id="clock-display">12:00</div>
        <div class="greeting-container">
          <span class="greeting-text" id="greeting-text" data-i18n="greetings.welcome">Welcome</span>
        </div>
      </section>

      <!-- Search Section -->
      <section class="search-section">
        <form id="search-form" action="https://www.startpage.com/do/dsearch" method="GET" class="search-form"
          target="_self">
          <div class="search-input-wrapper">
            <img src="img/search.svg" class="icon-img search-icon" width="20" height="20" alt="Search">
            <input type="text" name="query" id="search-input" class="search-input" placeholder="Search on Startpage"
              autocomplete="off" spellcheck="false" autofocus>
            <button type="button" id="clear-search-btn" class="clear-btn" aria-label="Clear Search" data-i18n-aria-label="search.clear">
              <img src="img/close.svg" class="icon-img" width="16" height="16" alt="Clear">
            </button>
            <button type="submit" class="submit-search-btn" aria-label="Search" data-i18n-aria-label="search.submit">
              <img src="img/arrow_forward.svg" class="icon-img submit-icon" width="20" height="20" alt="Search">
            </button>

            <!-- Autosuggest Dropdown -->
            <div class="search-suggestions-dropdown" id="search-suggestions" aria-hidden="true"></div>
          </div>
        </form>
      </section>

      <!-- Bookmarks / Quick Links Grid -->
      <section class="bookmarks-section" id="bookmarks-section">
        <div class="section-header">
          <h2 class="section-title" data-i18n="bookmarks.quickAccess">Quick Access</h2>
          <button id="add-bookmark-btn" class="btn-secondary" title="Add Shortcut" data-i18n-title="bookmarks.addShortcut">
            <img src="img/add.svg" class="icon-img" width="16" height="16" alt="Add">
            <span data-i18n="bookmarks.addShortcut">Add Shortcut</span>
          </button>
        </div>

        <div class="bookmarks-grid" id="bookmarks-grid">
          <!-- Dynamically populated bookmarks -->
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-hint">
        <span class="kbd-hint"><kbd>/</kbd> <span data-i18n="footer.focusSearch">Focus search</span></span>
        <span class="kbd-hint"><kbd>1-9</kbd> <span data-i18n="footer.launchShortcut">Launch shortcut</span></span>
      </div>
    </footer>
  </div>

  <!-- Modal: Add / Edit Bookmark -->
  <div class="modal-overlay" id="bookmark-modal" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="bookmark-modal-title" data-i18n="bookmarks.addShortcut">Add Shortcut</h3>
        <button class="close-modal-btn" id="close-bookmark-modal" aria-label="Close" data-i18n-aria-label="settings.close">
          <img src="img/close.svg" class="icon-img" width="18" height="18" alt="Close">
        </button>
      </div>
      <form id="bookmark-form">
        <input type="hidden" id="bookmark-id">
        <div class="form-group">
          <label for="bookmark-title" data-i18n="bookmarks.title">Title</label>
          <input type="text" id="bookmark-title" placeholder="e.g. Wikipedia" data-i18n-placeholder="bookmarks.titlePlaceholder" required autocomplete="off">
        </div>
        <div class="form-group">
          <label for="bookmark-url" data-i18n="bookmarks.url">URL</label>
          <input type="text" id="bookmark-url" placeholder="https://wikipedia.org" data-i18n-placeholder="bookmarks.urlPlaceholder" required autocomplete="off">
        </div>
        <div class="form-group">
          <label for="bookmark-icon" data-i18n="bookmarks.iconUrl">Icon URL (optional)</label>
          <input type="url" id="bookmark-icon" placeholder="Leave empty for auto-favicon" data-i18n-placeholder="bookmarks.iconUrlPlaceholder">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="cancel-bookmark-btn" data-i18n="bookmarks.cancel">Cancel</button>
          <button type="submit" class="btn-primary" id="save-bookmark-btn" data-i18n="bookmarks.save">Save Shortcut</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Settings -->
  <div class="modal-overlay" id="settings-modal" aria-hidden="true">
    <div class="modal-card settings-card">
      <div class="modal-header">
        <h3 data-i18n="settings.title">Settings</h3>
        <button class="close-modal-btn" id="close-settings-modal" aria-label="Close" data-i18n-aria-label="settings.close">
          <img src="img/close.svg" class="icon-img" width="18" height="18" alt="Close">
        </button>
      </div>
      <div class="settings-content">
        <!-- Appearance & Language -->
        <div class="settings-group">
          <h4 data-i18n="settings.appearance">Appearance & Theme</h4>
          <div class="setting-row">
            <span data-i18n="settings.themeMode">Theme Mode</span>
            <div class="segmented-control" id="theme-selector">
              <button type="button" data-val="auto" data-i18n="settings.themeSystem">System</button>
              <button type="button" data-val="dark" data-i18n="settings.themeDark">Dark</button>
              <button type="button" data-val="light" data-i18n="settings.themeLight">Light</button>
            </div>
          </div>
          <div class="setting-row">
            <span data-i18n="settings.language">Language</span>
            <div class="custom-dropdown" id="settings-lang-dropdown">
              <button type="button" class="custom-dropdown-trigger" id="settings-lang-trigger" aria-haspopup="listbox" aria-expanded="false" title="Choose Language">
                <span class="custom-dropdown-name" id="settings-lang-name">Auto (System)</span>
                <img src="img/expand_more.svg" class="icon-img custom-dropdown-arrow" width="18" height="18" alt="">
              </button>
              <div class="custom-dropdown-menu" id="settings-lang-menu" role="listbox" aria-hidden="true">
                <!-- Dynamically populated options -->
              </div>
            </div>
          </div>
          <div class="setting-row">
            <span data-i18n="settings.glow">Background Glow Effects</span>
            <label class="toggle-switch">
              <input type="checkbox" id="toggle-glow" checked>
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <!-- Search Behavior -->
        <div class="settings-group">
          <h4 data-i18n="settings.searchHeader">Search & Suggestions</h4>
          <div class="setting-row">
            <span data-i18n="settings.searchEngine">Search Engine</span>
            <div class="custom-dropdown" id="settings-engine-dropdown">
              <button type="button" class="custom-dropdown-trigger" id="settings-engine-trigger" aria-haspopup="listbox" aria-expanded="false" title="Choose Search Engine">
                <img src="https://icons.duckduckgo.com/ip3/startpage.com.ico" class="custom-dropdown-icon" id="settings-engine-icon" width="18" height="18" alt="Engine">
                <span class="custom-dropdown-name" id="settings-engine-name">Startpage</span>
                <img src="img/expand_more.svg" class="icon-img custom-dropdown-arrow" width="18" height="18" alt="">
              </button>
              <div class="custom-dropdown-menu" id="settings-engine-menu" role="listbox" aria-hidden="true">
                <!-- Dynamically populated options with favicons -->
              </div>
            </div>
          </div>
          <div class="setting-row">
            <span data-i18n="settings.suggestions">Show Search Suggestions</span>
            <label class="toggle-switch">
              <input type="checkbox" id="toggle-suggestions" checked>
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <!-- Clock & Display -->
        <div class="settings-group">
          <h4 data-i18n="settings.clockHeader">Clock & Widgets</h4>
          <div class="setting-row">
            <span data-i18n="settings.clock24h">24-Hour Clock</span>
            <label class="toggle-switch">
              <input type="checkbox" id="toggle-24h" checked>
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <span data-i18n="settings.clockSeconds">Show Seconds</span>
            <label class="toggle-switch">
              <input type="checkbox" id="toggle-seconds">
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <span data-i18n="settings.greeting">Show Greeting</span>
            <label class="toggle-switch">
              <input type="checkbox" id="toggle-greeting" checked>
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <span data-i18n="settings.dateHeader">Show Date Header</span>
            <label class="toggle-switch">
              <input type="checkbox" id="toggle-date" checked>
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>

</html>
